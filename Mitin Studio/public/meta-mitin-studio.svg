<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Mitin Studio</title>
  <desc id="desc">Logotipo de Mitin Studio con letra M en negro sobre fondo gris claro.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#efefef" />
      <stop offset="100%" stop-color="#e7e7e7" />
    </linearGradient>
    <filter id="shadowM" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="8" flood-color="#000000" flood-opacity="0.18" />
    </filter>
    <filter id="shadowText" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.16" />
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)" />

  <g transform="translate(600 535)" filter="url(#shadowM)">
    <path
      d="M -220 200 V -160 H -120 L 0 30 L 120 -160 H 220 V 200 H 120 V 5 L 0 170 L -120 5 V 200 Z"
      fill="#0a0a0a"
    />
  </g>

  <g transform="translate(600 860)" filter="url(#shadowText)">
    <text
      x="0"
      y="0"
      text-anchor="middle"
      font-family="Helvetica, Arial, sans-serif"
      font-size="82"
      font-weight="700"
      letter-spacing="8"
      fill="#0a0a0a"
    >
      MITIN STUDIO
    </text>
  </g>
</svg>
