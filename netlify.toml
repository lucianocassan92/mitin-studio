[build]
  base = "Mitin Studio"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/tratamientos"
  to = "/tratamientos.html"
  status = 200

[[redirects]]
  from = "/tratamientos/"
  to = "/tratamientos.html"
  status = 200

[[redirects]]
  from = "/en"
  to = "/en.html"
  status = 200

[[redirects]]
  from = "/en/"
  to = "/en.html"
  status = 200

[[redirects]]
  from = "/en/treatments"
  to = "/en-treatments.html"
  status = 200

[[redirects]]
  from = "/en/treatments/"
  to = "/en-treatments.html"
  status = 200

[[redirects]]
  from = "/politica-cookies"
  to = "/politica-cookies.html"
  status = 200

[[redirects]]
  from = "/politica-cookies/"
  to = "/politica-cookies.html"
  status = 200

[[redirects]]
  from = "/en/cookie-policy"
  to = "/en-cookie-policy.html"
  status = 200

[[redirects]]
  from = "/en/cookie-policy/"
  to = "/en-cookie-policy.html"
  status = 200

[[redirects]]
  from = "/wp-admin/*"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/wordpress/*"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/wp-login.php"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/xmlrpc.php"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*/wp-includes/wlwmanifest.xml"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
